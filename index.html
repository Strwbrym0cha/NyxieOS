<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F45BB2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NyxieOS" />
    <title>NyxieOS ✨</title>
    <style>
      /* Targeted Wellness mobile checkbox hotfix. The global .card > label input rule
         makes direct-child checkboxes full-width, which pushes their text off-screen. */
      .wellness-card > .wellness-check-label {
        display: flex !important;
        align-items: center;
        gap: 10px;
        min-width: 0;
        width: 100%;
      }
      .wellness-card > .wellness-check-label input[type="checkbox"] {
        width: 20px !important;
        height: 20px !important;
        min-width: 20px !important;
        min-height: 20px !important;
        padding: 0 !important;
        margin: 0;
        flex: 0 0 20px;
        accent-color: var(--nyxie-pink, #F45BB2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <link rel="stylesheet" href="/src/magical-v3.css" />
  </body>
</html>
